<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わたしだけの麻辣湯</title>
<style>
*{box-sizing:border-box}
:root{--pink:#e96c96;--dark:#633044;--line:#edced7}
body{margin:0;background:#fff8f5;color:var(--dark);font-family:system-ui,sans-serif}
button,select{font:inherit}button{cursor:pointer}
header{text-align:center;padding:18px;background:#fff0f4;border-bottom:2px solid var(--line)}
header h1{margin:0;font-size:clamp(23px,5vw,34px)}
header p{font-size:13px;margin:6px 0 0}
main{max-width:1000px;margin:auto;padding:12px}
.screen{display:none}.screen.active{display:block}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 3px 10px #8b435010}
.title{font-size:22px;margin:0 0 5px}
.sub{font-size:13px;color:#916879;margin:0 0 14px}
.btn{border:0;background:var(--pink);color:white;padding:13px 20px;border-radius:30px;font-weight:800}
.secondary{background:white!important;color:var(--dark)!important;border:1px solid var(--line)!important}
.btnrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}
.hero{text-align:center;padding:30px 12px;background:linear-gradient(145deg,#ffe0e9,#fff4e9);border-radius:20px}
.hero .food{font-size:clamp(90px,22vw,160px)}
.hero h2{font-size:clamp(25px,6vw,42px);margin:5px}
.hero p{line-height:1.8}
.steps{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0 15px}
.step{font-size:11px;border-radius:20px;padding:7px 10px;background:#f5e5eb}
.step.on{background:var(--pink);color:white}
.categories{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.cat{white-space:nowrap;border:1px solid var(--line);background:#fff8f8;border-radius:20px;padding:8px 13px;color:var(--dark)}
.cat.active{background:var(--pink);color:white}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:600px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{position:relative;border:2px solid #f0dce1;background:#fffaf9;border-radius:13px;padding:9px 3px;color:var(--dark);min-width:0}
.tile.selected{border-color:var(--pink);background:#fff0f5}
.emoji{font-size:35px;display:block;line-height:1.4}
.name{font-size:12px;font-weight:750;display:block;overflow-wrap:anywhere}
.tile small{font-size:11px;color:#9b7180}
.check{position:absolute;top:4px;right:5px;background:var(--pink);color:white;border-radius:50%;font-size:12px;width:19px;height:19px;display:grid;place-items:center}
.stripe{width:52px;height:37px;border-radius:12px;margin:1px auto 5px;border:1px solid #e9b6a4;background:repeating-linear-gradient(0deg,#fff4dc 0 7px,#f28b49 7px 14px)}
.noodle{width:47px;height:34px;border:4px solid #e9cfa2;border-radius:50%;margin:3px auto 6px;background:repeating-linear-gradient(0deg,#fff3d8 0 3px,#e3ba75 4px 5px)}
.soups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
@media(min-width:600px){.soups{grid-template-columns:repeat(3,minmax(0,1fr))}}
.soup{border:2px solid var(--line);background:white;border-radius:15px;padding:12px 5px;color:var(--dark)}
.soup.selected{border-color:var(--pink);background:#fff0f5}
.soup .emoji{font-size:42px}.soup b{display:block;font-size:14px}.soup small{font-size:11px}
.basket{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:650px){.basket{grid-template-columns:1fr 1fr}}
.bowl{font-size:100px;text-align:center;padding:15px;background:linear-gradient(#fff7f0,#ffe8dc);border-radius:16px}
.total{text-align:center;background:#fff0f4;padding:12px;border-radius:12px;font-size:23px;font-weight:850;color:#bd416b}
.cook{text-align:center;padding:25px 10px}
.pot{font-size:100px;animation:bob 1s infinite alternate}
@keyframes bob{to{transform:translateY(-8px) rotate(4deg)}}
.bar{height:14px;border-radius:20px;background:#f1dce3;overflow:hidden;margin:15px auto;max-width:400px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#f28cae,#c84372);transition:width .3s}
.finished{background:linear-gradient(140deg,#fff0f5,#ffead7);text-align:center;padding:20px;border-radius:20px}
.bigbowl{font-size:clamp(100px,25vw,180px)}
.note{font-size:12px;color:#987481}
footer{text-align:center;font-size:11px;color:#a88b96;padding:18px}
</style>
</head>
<body>
<header>
<h1>♡ わたしだけの麻辣湯 ♡</h1>
<p>好きな具材を選んで、あなただけの一杯を作ろう！</p>
</header>
<main>
<div class="steps" id="stepList">
<span class="step on">START</span><span class="step">① 具材</span>
<span class="step">② 麺</span><span class="step">③ スープ</span>
<span class="step">④ カゴ</span><span class="step">⑤ 調理</span><span class="step">⑥ 完成</span>
</div>

<section class="screen active" id="start">
<div class="hero">
<div class="food">🍜</div>
<h2>わたしだけの<br>麻辣湯をつくろう！</h2>
<p>好きな具材も、麺も、スープも自由に選べるよ。<br>自分だけのオリジナル麻辣湯を作っちゃおう！</p>
<button class="btn" onclick="goScreen('ingredients')">はじめる ❯</button>
</div>
</section>

<section class="screen" id="ingredients">
<div class="panel">
<h2 class="title">① 材料を選ぼう！</h2>
<p class="sub">好きな具材をタップしてカゴに入れてね（制限なし）</p>
<div class="categories" id="categories"></div>
<div class="grid" id="ingredientGrid"></div>
<p class="sub" id="count" style="margin-top:12px;text-align:center;font-weight:bold;"></p>
<div class="btnrow">
<button class="btn secondary" onclick="goScreen('start')">戻る</button>
